<div *ngIf="(confirmationService.confirmation$ | async) as confirmation" 
         class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
      <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4 shadow-xl">
        <h3 class="text-lg font-semibold text-gray-900 mb-2">
          {{ confirmation.title }}
        </h3>
        <p class="text-gray-600 mb-6">
          {{ confirmation.message }}
        </p>
        <div class="flex justify-end space-x-3">
          <button
            (click)="confirmationService.respond(false)"
            class="px-4 py-2 text-gray-700 bg-gray-100 rounded-md hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-gray-400"
          >
            {{ confirmation.cancelText || 'No' }}
          </button>
          <button
            (click)="confirmationService.respond(true)"
            class="px-4 py-2 text-white bg-blue-600 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            {{ confirmation.confirmText || 'Yes' }}
          </button>
        </div>
      </div>
    </div>
