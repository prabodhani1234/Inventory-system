      <div class="sidebar-container" [class.expanded]="isExpanded">
        <!-- Parent Menu Items -->
        <div *ngFor="let item of menuItems" class="relative">
          <!-- Parent Menu Item -->
          <a (click)="item.isExpanded = !item.isExpanded"
            [routerLink]="item.path"
            routerLinkActive="bg-gray-700"
            class="flex items-center justify-between px-4 py-3 hover:bg-gray-700 cursor-pointer transition-all duration-500 ease-in-out">
            <div class="flex items-center">
              <svg class="w-5 h-5 transition-colors duration-500"
                  [class.mr-3]="isExpanded"
                  viewBox="0 0 24 24" 
                  fill="none" 
                  stroke="currentColor">
                <ng-container [ngSwitch]="item.icon">
                  <path *ngSwitchCase="'home'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                  <path *ngSwitchCase="'users'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                  <path *ngSwitchCase="'settings'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                </ng-container>
              </svg>
              <span *ngIf="isExpanded" 
                    class="transition-all duration-500">
                {{item.label}}
              </span>
            </div>
            <svg *ngIf="item.children" 
                class="w-4 h-4 transform transition-transform duration-1000 ease-in-out"
                [class.rotate-180]="item.isExpanded"
                [class.hidden]="!isExpanded"
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </a>

          <!-- Submenu with smoother animations -->
          <div *ngIf="item.children"
              class="overflow-hidden transition-all duration-1000 ease-in-out"
              [style.maxHeight]="item.isExpanded ? '500px' : '0'"
              [style.opacity]="item.isExpanded ? '1' : '0'"
              [class.bg-gray-800]="isExpanded"
              [class.bg-gray-800]="!isExpanded">
            <div class="transform transition-all duration-1000 ease-in-out"
                [style.transform]="item.isExpanded ? 'translateY(0)' : 'translateY(-10px)'"
                [style.opacity]="item.isExpanded ? '1' : '0'">
              <a *ngFor="let child of item.children"
                [routerLink]="child.path"
                routerLinkActive="bg-gray-700"
                class="flex items-center transition-all duration-1000 ease-in-out hover:bg-gray-700/50"
                [class.px-8]="isExpanded"
                [class.px-4]="!isExpanded"
                [class.py-3]="true">
                <svg [class]="'w-5 h-5 transition-all duration-1000'"

                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor">

                    <path *ngSwitchCase="'users'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                    <path *ngSwitchCase="'settings'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                  </ng-container>
                </svg>
                <span *ngIf="isExpanded" 
                      class="transition-all duration-1000">
                  {{child.label}}
                </span>
              </a>
            </div>
          </div>
        </div>
      </div>

    <div class="col-start-2">
      <nav class="bg-gray-50 text-gray-900 shadow-lg">
        <div class="w-full px-4">
          <div class="flex justify-between items-center h-14">
            <!-- Left Section -->
            <div class="flex items-center space-x-4">
              <!-- Logo/Brand -->
               
              <div class="flex items-center">
                <button (click)="toggleExpanded()" 
                        class="p-2 rounded-lg hover:text-gray-500 transition-colors">
                        <svg *ngIf="isExpanded" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                        <svg *ngIf="!isExpanded" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                </button>
              </div>
            </div>
      
            <div class="flex items-center space-x-4">
                <div class="hidden md:flex space-x-2">
                    <div class="text-sm text-gray-900">
                      {{ currentDate | date:'medium' }}
                    </div>
                </div>

              <div class="relative" (click)="toggleDropdown()" >
                <!-- Profile Image Button -->
                <div 
                  
                  class="relative cursor-pointer">
                  <img
                    [src]="userProfileImage || '/api/placeholder/32/32'"
                    alt="Profile"
                    class="h-8 w-8 rounded-full object-cover border-2 border-gray-600"
                  >
                  <div class="absolute bottom-0 right-0 h-3 w-3 rounded-full bg-green-500 border-2 border-gray-800"></div>
                </div>
          
                <!-- Dropdown Menu -->
                <div *ngIf="isOpen"

                  <div class="px-4 py-2 border-b">
                    <p class="text-sm font-medium text-gray-900">John Doe</p>
                    <p class="text-sm text-gray-500">johom</p>
                  </div>
          
                  <!-- Menu Items -->
                  <a routerLink="/profile" 
                     class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                    <svg xmlns="http://www.w3.org/2000/svg" 
                         class="h-4 w-4 mr-3" 
                         fill="none" 
                         viewBox="0 0 24 24" 
                         stroke="currentColor">
                      <path stroke-linecap="round" 
                            stroke-linejoin="round" 
                            stroke-width="2" 
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                    My Profile
                  </a>
          
                  <a routerLink="/settings"

                    <svg xmlns="http://www.w3.org/2000/svg" 
                         class="h-4 w-4 mr-3" 
                         fill="none" 
                         viewBox="0 0 24 24" 
                         stroke="currentColor">
                      <path stroke-linecap="round" 
                            stroke-linejoin="round" 
                            stroke-width="2" 
                            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                      <path stroke-linecap="round" 
                            stroke-linejoin="round" 
                            stroke-width="2" 
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    Settings
                  </a>
          
                  <button (click)="logout()"

                    <svg xmlns="http://www.w3.org/2000/svg" 
                         class="h-4 w-4 mr-3" 
                         fill="none" 
                         viewBox="0 0 24 24" 
                         stroke="currentColor">
                      <path stroke-linecap="round" 
                            stroke-linejoin="round" 
                            stroke-width="2" 
                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                    Logout
                  </button>
                </div>
              </div>
              
              <!-- Name and Role -->
              <div class="hidden md:block text-left">
                <div class="text-sm font-medium">Prabodhnai</div>
                <div class="text-xs text-gray-400">Chashier</div>
              </div>
      
              <!-- Fullscreen Button -->
              <button (click)="toggleFullscreen()" class="p-2 hover:bg-gray-700 rounded-full" [title]="isFullscreen ? 'Exit Fullscreen' : 'Enter Fullscreen'">
                <svg *ngIf="!isFullscreen" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                </svg>
                <svg *ngIf="isFullscreen" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 16h-2v4h4v-2H6v-2zM6 8H4V4h4v2H6v2zm12 0h2V4h-4v2h2v2zm2 8h-2v2h-2v2h4v-4z" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </nav>
    </div>
    <main class="col-start-2 row-start-2 overflow-auto p-6">
      <router-outlet></router-outlet>
    </main>
