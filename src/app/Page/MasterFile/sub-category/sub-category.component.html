<div class="max-w-md p-6 bg-white rounded-lg shadow-md">
  <h2 class="text-2xl font-bold mb-6 text-gray-800">SubCategory</h2>

  <form [formGroup]="subCategoryForm" (ngSubmit)="postData()" class="space-y-4">
    <div class="mb-4 relative dropdown-container">
      <label for="cat_Code" class="block text-sm font-medium text-gray-700 mb-1">
        Category Code
      </label>
      <div class="relative">
        <input id="cat_Code" type="text" formControlName="cat_Code" (focus)="openDropdown('code')"
          class="w-full px-3 py-2 md:py-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-base md:text-sm"
          [ngClass]="{'border-red-500': isFieldInvalid('cat_Code')}" autocomplete="off">

        <!-- Custom Dropdown for Code -->
        <div *ngIf="activeDropdown === 'code' && filteredCodes.length > 0"
          class="absolute z-10 w-full mt-1 bg-white border border-gray-300 rounded-md shadow-lg max-h-48 overflow-y-auto"
          (mousedown)="$event.preventDefault()">
          <div *ngFor="let category of filteredCodes" (click)="selectCode(category)"
            class="px-3 py-2 hover:bg-gray-100 cursor-pointer">
            {{category.cat_Code}}
          </div>
        </div>
      </div>
      <div *ngIf="isFieldInvalid('cat_Code')" class="text-red-500 text-sm mt-1">
        Category code is required
      </div>
    </div>

    <!-- Category Name -->
    <div class="mb-4 relative dropdown-container">
      <label for="cat_Name" class="block text-sm font-medium text-gray-700 mb-1">
        Category Name
      </label>
      <div class="relative">
        <input id="cat_Name" type="text" formControlName="cat_Name" (focus)="openDropdown('name')"
          class="w-full px-3 py-2 md:py-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-base md:text-sm"
          [ngClass]="{'border-red-500': isFieldInvalid('cat_Name')}" autocomplete="off">

        <!-- Custom Dropdown for Name -->
        <div *ngIf="activeDropdown === 'name' && filteredNames.length > 0"
          class="absolute z-10 w-full mt-1 bg-white border border-gray-300 rounded-md shadow-lg max-h-48 overflow-y-auto"
          (mousedown)="$event.preventDefault()">
          <div *ngFor="let category of filteredNames" (click)="selectName(category)"
            class="px-3 py-2 hover:bg-gray-100 cursor-pointer">
            {{category.cat_Name}}
          </div>
        </div>
      </div>
      <div *ngIf="isFieldInvalid('cat_Name')" class="text-red-500 text-sm mt-1">
        Category name is required
      </div>
    </div>


    <!--SUB CATEGORY-->
    <div class="mb-4 relative dropdown-container">
      <label for="subCat_Code" class="block text-sm font-medium text-gray-700 mb-1">
        Sub Category Code
      </label>
      <div class="relative">
        <input id="subCat_Code" type="text" formControlName="subCat_Code" (focus)="openDropdown('sub_code')"
          class="w-full px-3 py-2 md:py-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-base md:text-sm"
          [ngClass]="{'border-red-500': isFieldInvalid('subCat_Code')}" autocomplete="off">

        <!-- Custom Dropdown for Code -->
        <div *ngIf="activeDropdown === 'sub_code' && filteredSubCatCodes.length > 0"
          class="absolute z-10 w-full mt-1 bg-white border border-gray-300 rounded-md shadow-lg max-h-48 overflow-y-auto"
          (mousedown)="$event.preventDefault()">
          <div *ngFor="let subCategory of filteredSubCatCodes" (click)="selectSubCode(subCategory)"
            class="px-3 py-2 hover:bg-gray-100 cursor-pointer">
            {{subCategory.subCat_Code}}
          </div>
        </div>
      </div>
      <div *ngIf="isFieldInvalid('subCat_Code')" class="text-red-500 text-sm mt-1">
        Category code is required
      </div>
    </div>

    <!-- Category Name -->
    <div class="mb-4 relative dropdown-container">
      <label for="subCat_Name" class="block text-sm font-medium text-gray-700 mb-1">
        Sub Category Name
      </label>
      <div class="relative">
        <input id="subCat_Name" type="text" formControlName="subCat_Name" (focus)="openDropdown('sub_name')"
          class="w-full px-3 py-2 md:py-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-base md:text-sm"
          [ngClass]="{'border-red-500': isFieldInvalid('subCat_Name')}" autocomplete="off">

        <!-- Custom Dropdown for Name -->
        <div *ngIf="activeDropdown === 'sub_name' && filteredSubCatNames.length > 0"
          class="absolute z-10 w-full mt-1 bg-white border border-gray-300 rounded-md shadow-lg max-h-48 overflow-y-auto"
          (mousedown)="$event.preventDefault()">
          <div *ngFor="let subCategory of filteredSubCatNames" (click)="selectSubName(subCategory)"
            class="px-3 py-2 hover:bg-gray-100 cursor-pointer">
            {{subCategory.subCat_Name}}
          </div>
        </div>
      </div>
      <div *ngIf="isFieldInvalid('subCat_Name')" class="text-red-500 text-sm mt-1">
        Category name is required
      </div>
    </div>

    <div class="space-y-2">
      <app-buttons [isSubmitting]="isSubmitting" [isInvalid]="subCategoryForm.invalid" (delete)="onDeleteCategory()"
        (clean)="clearForm()"></app-buttons>
    </div>

    <div class="fixed inset-0 -z-10" *ngIf="activeDropdown" (click)="onClickOutside($event)"></div>
  </form>
  <app-alert></app-alert>
  <app-confirmation></app-confirmation>
</div>
