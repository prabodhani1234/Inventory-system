<div class="max-w-md p-6 bg-white rounded-lg shadow-md">
    <h2 class="text-2xl font-bold mb-6 text-gray-800">Create Category</h2>

    <form [formGroup]="categoryForm" (ngSubmit)="postData()" class="space-y-4">
        <div class="mb-4 relative dropdown-container">
            <label for="cat_Code" class="block text-sm font-medium text-gray-700 mb-1">
              Category Code
            </label>
            <div class="relative">
              <input
                id="cat_Code"
                type="text"
                formControlName="cat_Code"
                (focus)="openDropdown('code')"
                class="w-full px-3 py-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                [ngClass]="{'border-red-500': isFieldInvalid('cat_Code')}"
                autocomplete="off">
              
              <!-- Custom Dropdown for Code -->
              <div 
                *ngIf="activeDropdown === 'code' && filteredCodes.length > 0"
                class="absolute z-10 w-full mt-1 bg-white border border-gray-300 rounded-md shadow-lg max-h-48 overflow-y-auto"
                (mousedown)="$event.preventDefault()">
                <div 
                  *ngFor="let category of filteredCodes"
                  (click)="selectCode(category)"
                  class="px-3 py-2 hover:bg-gray-100 cursor-pointer">
                  {{category.cat_Code}}
                </div>
              </div>
            </div>
            <div *ngIf="isFieldInvalid('cat_Code')" class="text-red-500 text-sm mt-1">
              Category code is required
            </div>
          </div>
        
          <!-- Category Name -->
          <div class="mb-4 relative dropdown-container">
            <label for="cat_Name" class="block text-sm font-medium text-gray-700 mb-1">
              Category Name
            </label>
            <div class="relative">
              <input
                id="cat_Name"
                type="text"
                formControlName="cat_Name"
                (focus)="openDropdown('name')"
                class="w-full px-3 py-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                [ngClass]="{'border-red-500': isFieldInvalid('cat_Name')}"
                autocomplete="off">
              
              <!-- Custom Dropdown for Name -->
              <div 
                *ngIf="activeDropdown === 'name' && filteredNames.length > 0"
                class="absolute z-10 w-full mt-1 bg-white border border-gray-300 rounded-md shadow-lg max-h-48 overflow-y-auto"
                (mousedown)="$event.preventDefault()">
                <div 
                  *ngFor="let category of filteredNames"
                  (click)="selectName(category)"
                  class="px-3 py-2 hover:bg-gray-100 cursor-pointer">
                  {{category.cat_Name}}
                </div>
              </div>
            </div>
            <div *ngIf="isFieldInvalid('cat_Name')" class="text-red-500 text-sm mt-1">
              Category name is required
            </div>
          </div>

        <!-- Button Group Component -->
        <div class="space-y-2">
            <app-buttons [isSubmitting]="isSubmitting" [isInvalid]="categoryForm.invalid"
                (delete)="onDeleteCategory()" (clean)="clearForm()"></app-buttons>
        </div>

        <div class="fixed inset-0 -z-10" *ngIf="activeDropdown" (click)="onClickOutside($event)"></div>
